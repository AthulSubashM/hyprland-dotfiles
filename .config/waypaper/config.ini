[Settings]
language = en
folder = ~/Pictures/Wallpapers
monitors = All
wallpaper = ~/Pictures/Wallpapers/aesthetic/lofi-cafe_gray.jpg
show_path_in_tooltip = True
backend = awww
fill = fill
sort = name
color = #ffffff
subfolders = True
all_subfolders = True
show_hidden = False
show_gifs_only = False
zen_mode = False
post_command = wal -i $wallpaper --cols16 && bash -l -c "/home/athul/.config/hypr/scripts/walpaper_refresh.sh" && ln -sf "$wallpaper" "$HOME/.config/waypaper/current_wallpaper"
number_of_columns = 3
swww_transition_type = any
swww_transition_step = 63
swww_transition_angle = 0
swww_transition_duration = 2
swww_transition_fps = 60
mpvpaper_sound = False
mpvpaper_options = 
use_xdg_state = False
stylesheet = /home/athul/.config/waypaper/style.css
keybindings = ~/.config/waypaper/keybindings.ini

