#!/bin/sh
BUS=3

choice=$(printf "Racing\nsRGB\nCinema\nScenery\nRTS/RPG\nFPS\nMOBA\nNight Vision\nUser Mode" | fuzzel --dmenu --prompt="GameVisual ❯ " --lines=9)
[ -z "$choice" ] && exit 0

case "$choice" in
    "Racing")       code="0x05"; color="rgb(ff0029)" ;;
    "sRGB")         code="0x03"; color="rgb(40a02b)" ;;
    "Cinema")       code="0x01"; color="rgb(8839ef)" ;;
    "Scenery")      code="0x02"; color="rgb(179299)" ;;
    "RTS/RPG")      code="0x06"; color="rgb(1e66f5)" ;;
    "FPS")          code="0x07"; color="rgb(df8e1d)" ;;
    "MOBA")         code="0x08"; color="rgb(ea76cb)" ;;
    "Night Vision") code="0x09"; color="rgb(fe640b)" ;;
    "User Mode")    code="0x04"; color="rgb(7287fd)" ;;
    *) exit 1 ;;
esac

ddcutil --bus $BUS --noverify setvcp DC $code &
hyprctl notify -1 3000 "$color" "fontsize:16  󱄄    GameVisual • $choice" &
