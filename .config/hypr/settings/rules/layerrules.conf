#Waybar
layerrule {
  name = layerrule-1
  blur = on
  ignore_alpha = 0.5
  match:namespace = waybar
}


# Layer Rules for Fuzzel
layerrule {
  name = layerrule-2
  dim_around = on
  animation = slide
  match:namespace = launcher
}

# Wlogout
layerrule {
  name = wlogout-layer
  above_lock = 2
  match:namespace = logout_dialog
}


