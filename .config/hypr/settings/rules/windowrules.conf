# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules
source = ~/.config/hypr/settings/themes/colors/catppucin_mocha.conf
# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrule = match:class .*, suppress_event maximize

# Fix some dragging issues with XWayland
windowrule {
  name = windowrule-1
  no_focus = on
  match:class = ^$
  match:title = ^$
  match:xwayland = 1
  match:float = 1
  match:fullscreen = 0
  match:pin = 0
}


# Rule for Network Manager GUI
windowrule {
  name = windowrule-2
  float = on
  size = (monitor_w*0.25) (monitor_h*0.4)
  move = ((monitor_w*0.745)) ((monitor_h*0.05))
  match:class = ^(nm-connection-editor)$
}


# Rule for Bluetooth Manager GUI
windowrule {
  name = windowrule-3
  float = on
  size = (monitor_w*0.3) (monitor_h*0.6)
  move = ((monitor_w*0.68)) ((monitor_h*0.05))
  animation = slide
  border_size = 0
  match:class = ^(blueman-manager)$
}


# Rule for Volume Control (Pavucontrol)
windowrule {
  name = windowrule-4
  float = on
  size = (monitor_w*0.3) (monitor_h*0.4)
  move = ((monitor_w*0.69)) ((monitor_h*0.05))
  animation = slide
  border_size = 0
  match:class = ^(org.pulseaudio.pavucontrol)$
}



# Rule for nmtui (NetworkManager Text User Interface)
windowrule {
  name = windowrule-5
  float = on
  size = (monitor_w*0.4) (monitor_h*0.5)
  move = ((monitor_w*0.3)) ((monitor_h*0.25))
  match:class = ^(nmtui-float)$
}



# Rules for notes menu
windowrule {
  name = windowrule-6
  float = on
  border_size = 0
  size = (monitor_w*0.5) (monitor_h*0.5)
  move = 
  opaque = 1
  match:title = ^(notes)$
}

                                           
             
# Smart Gaps
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
windowrule {
  name = windowrule-7
  border_size = 0
  rounding = 0
  match:float = 0
  match:workspace = w[tv1]
}

windowrule {
  name = windowrule-8
  border_size = 0
  rounding = 0
  match:float = 0
  match:workspace = f[1]
}



#PICTURE IN PICTURE WINDOW RULES
windowrule {
  name = windowrule-9
  float = on
  size = 600 340
  match:title = ^Picture-in-Picture$
}


# FZF Search
windowrule {
  name = windowrule-10
  float = on
  border_size = 1
  rounding = 0
  dim_around = 1
  animation = slide 20%
  match:title = ^(FZF_Search)$
}




# Whatsapp Web
windowrule {
  name = windowrule-11
  float = on
  border_size = 0
  size = 800 600
  move = ((monitor_w*0.1)) ((monitor_h*0.1))
  match:class = ^(chrome-hnpfjngllnobngcgfapefoaidbinmjnm-Default)$
}



# Hyprpolkitagent
windowrule {
  name = windowrule-12
  dim_around = 1
  animation = popin
  match:class = ^(hyprpolkitagent)$
}


# pinned
windowrule {
  name = windowrule-13
  border_color = $mauve $crust
  opaque = 1
  match:pin = 1
}

windowrule {
  name = windowrule-14
  opaque = 1
  match:float = 1
}



# Image viewer
windowrule {
  name = windowrule-15
  float = on
  size = 800 600
  opaque = 1
  no_blur = on
  match:class = ^(ristretto)$
}


#Waypaper
windowrule {
  name = windowrule-16
  float = on
  match:class = ^(waypaper)$
}


