source = $HOME/.cache/wal/hyprland-colors.conf

$accent = $color1
$accentAlpha = $color1Alpha
$font = JetBrainsMono Nerd Font

# GENERAL
general {
  hide_cursor = false
}

# auth{
# fingerprint {
#          enabled = true
#          ready_message = Scan fingerprint to unlock
#          present_message = Scanning...
#          retry_delay = 250 # in milliseconds
#      }
# }


# BACKGROUND
background {
  monitor =
  path = $HOME/.config/waypaper/current_wallpaper
  # path = ~/Pictures/Wallpapers/minimal/background.jpg
  blur_passes = 2
  blur_size = 7
  color = $background
}

# Battery
label {
  monitor =
  text = cmd[update:1000] echo -e "$(~/.config/hypr/scripts/hyprlock/battery.sh)"
  color = $foreground
  font_size = 25
  font_family = $font
  position = 30, -30
  halign = left
  valign = top
}

# Power
label{
  monitor =
  text = <span> ⏾ </span>
  onclick = systemctl hibernate 
  color = $foreground
  font_family = $font
  font_size = 25
  position = -100, 30
  halign = right
  valign = bottom
}
label{
  monitor =
  text = <span> 󰜉 </span>
  onclick = hyprshutdown -t 'Rebooting' --post-cmd 'systemctl reboot'
  color = $foreground
  font_family = $font
  font_size = 25
  position = -60, 30
  halign = right
  valign = bottom
}
label{
  monitor =
  text = <span> ⏻ </span>
  onclick = hyprshutdown -t 'Shutting Down' --post-cmd 'systemctl poweroff'
  color = $foreground
  font_family = $font
  font_size = 25
  position = -20, 30
  halign = right
  valign = bottom
}


# TIME
label {
  monitor =
  text = $TIME12
  color = $foreground
  font_size = 90
  font_family = $font
  position = -30, 0
  halign = right
  valign = top
}

# DATE
label {
  monitor =
  text = cmd[update:43200000] date +"%A, %d %B %Y"
  color = $foreground
  font_size = 25
  font_family = $font
  position = -30, -150
  halign = right
  valign = top
}

# FINGERPRINT
# {
#   monitor = "";
#   text = "$FPRINTPROMPT";
#   color = "$text";
#   font_size = 14;
#   font_family = $font;
#   position = "0, -107";
#   halign = "center";
#   valign = "center";
# }

# USER AVATAR
image {
  monitor =
  path = $HOME/.face
  size = 100
  border_color = $accent
  position = 0, 75
  halign = center
  valign = center
}

# INPUT FIELD
input-field {
  monitor =
  size = 300, 60
  outline_thickness = 4
  dots_size = 0.2
  dots_spacing = 0.2
  dots_center = true
  outer_color = $accent
  inner_color = $color9
  font_color = $foreground
  fade_on_empty = false
  placeholder_text = <span foreground="##$foregroundAlpha"><i>󰌾 Logged in as </i><span foreground="##$accentAlpha">$USER</span></span>
  hide_input = false
  check_color = $accent
  fail_color = rgb(880F0A)
  fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
  capslock_color = $color2
  position = 0, -47
  halign = center
  valign = center
}
:
